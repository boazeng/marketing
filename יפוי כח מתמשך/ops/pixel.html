<!-- Injected by ops/deploy.py before </body>. Not part of the page in SharePoint:
     the marketer's file stays hers, and measurement stays ours.

     Meta Pixel, loaded only after the visitor says yes. The answer is kept in
     localStorage rather than a cookie -- refusing cookies by setting one is the
     wrong way round. Same approach as bedek/site/src/lib/pixel.ts. -->
<style>
  .zc{position:fixed;inset:auto 16px 16px 16px;z-index:100;max-width:560px;margin-inline:auto;
    background:#fff;color:#1c2a3a;border:1px solid rgba(15,39,68,.14);border-radius:16px;
    box-shadow:0 18px 50px rgba(15,39,68,.18);padding:16px 18px;font:400 15px/1.6 Heebo,system-ui,sans-serif;
    direction:rtl;display:none}
  .zc.on{display:block}
  .zc p{margin:0 0 12px}
  .zc div{display:flex;gap:10px}
  .zc button{font:600 15px Heebo,system-ui,sans-serif;border-radius:999px;padding:9px 20px;cursor:pointer;
    border:2px solid #0f2744;background:#0f2744;color:#fff}
  .zc button.no{background:transparent;color:#0f2744}
  .zc button:focus-visible{outline:3px solid #c4a35a;outline-offset:2px}
</style>
<div class="zc" id="zc" role="dialog" aria-live="polite" aria-label="עוגיות">
  <p>האתר משתמש בעוגיות של פייסבוק כדי למדוד מאיפה הגיעו הפניות. בלי זה האתר עובד בדיוק אותו דבר.</p>
  <div><button id="zc-yes">מאשר</button><button id="zc-no" class="no">לא, תודה</button></div>
</div>
<script>
(function () {
  var PIXEL = "__PIXEL_ID__", KEY = "zohar-consent", box = document.getElementById("zc");
  function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function store(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }

  function load() {
    if (window.fbq) return;
    !function(f,b,e,v,n,t,s){n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
    fbq("init", PIXEL);
    fbq("track", "PageView");
  }

  // The page has no form: a visitor who wants the lawyer taps "call" or
  // "WhatsApp". Those two taps are the only conversions there are to count.
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a[href]");
    if (!a || !window.fbq) return;
    var h = a.getAttribute("href");
    if (h.indexOf("tel:") === 0) fbq("track", "Contact", { content_name: "call" });
    else if (h.indexOf("wa.me") > -1) fbq("track", "Contact", { content_name: "whatsapp" });
  }, true);

  var prior = stored();
  if (prior === "granted") load();
  else if (prior !== "denied") box.classList.add("on");
  document.getElementById("zc-yes").onclick = function () { store("granted"); box.classList.remove("on"); load(); };
  document.getElementById("zc-no").onclick = function () { store("denied"); box.classList.remove("on"); };
})();
</script>
