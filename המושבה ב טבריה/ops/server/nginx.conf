server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # config.js משתנה בלי שינוי שם — אסור לשמור במטמון, אחרת מספר וואטסאפ
    # ישן ממשיך לעבוד אצל גולשים אחרי עדכון.
    location = /js/config.js { add_header Cache-Control "no-cache"; }
    location = /index.html   { add_header Cache-Control "no-cache"; }
    location ~* \.(css|js|png|jpg|webp|svg|ico)$ { add_header Cache-Control "public, max-age=3600"; }

    location / { try_files $uri $uri/ =404; }
}
